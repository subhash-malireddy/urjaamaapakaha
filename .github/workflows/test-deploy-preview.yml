name: Run Tests and Deploy a preview to Vercel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# This workflow runs tests for pull requests and pushes to main
# Note: Linting is intentionally excluded as it's handled by pre-commit hooks locally
# using Husky and lint-staged before each commit

jobs:
  test-and-deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor == 'subhash-malireddy'
    environment: preview
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Add OAuth environment variables
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      NEXTAUTH_URL: https://preview-subhash-malireddy-urjaamaapakaha.vercel.app
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      SPECIAL_DEVICE_IPS: ${{ secrets.SPECIAL_DEVICE_IPS }}

    steps:
      - uses: actions/checkout@v4

      # Install pnpm first without caching
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      # Then set up Node.js with pnpm caching
      # Note: The cache parameter here works with the pnpm action above
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      # Now we can use pnpm to install dependencies
      - name: Install dependencies
        run: pnpm install

      # Linting step is intentionally omitted
      # Local development enforces linting via pre-commit hooks
      # This ensures all committed code is already properly linted

      # Determine Jest cache directory
      - name: Get Jest cache directory
        id: jest-cache-dir
        run: |
          JEST_CONFIG=$(pnpm jest --showConfig 2>/dev/null)
          CACHE_DIR=$(echo "$JEST_CONFIG" | jq -r '.configs.[0].cacheDirectory' 2>/dev/null)

          if [[ -z "$CACHE_DIR" ]]; then
            echo "Error: Could not determine Jest cache directory." >&2
            exit 1
          fi

          echo "dir=$CACHE_DIR" >> "$GITHUB_OUTPUT"

      # Restore Jest cache to speed up tests
      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.jest-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-jest-${{ hashFiles('**/jest.config.js') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-jest-${{ hashFiles('**/jest.config.js') }}-
            ${{ runner.os }}-jest-

      # Generate Prisma client
      - name: Generate Prisma client
        run: pnpm prisma generate

      # Run tests with coverage (no need to run tests twice)
      - name: Run tests with coverage
        run: pnpm test:coverage

      # # Save Jest cache after tests run
      # # Saves automatically when the workflow completes but if the above fails, this will save the cache
      # - name: Save Jest cache
      #   if: always() # Try to save cache even if tests fail
      #   uses: actions/cache/save@v4
      #   with:
      #     path: ${{ steps.jest-cache-dir.outputs.dir }}
      #     key: ${{ runner.os }}-jest-${{ hashFiles('**/jest.config.js') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}

      # Upload coverage reports as artifacts
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      # Prisma migration
      - name: Prisma migrate deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm prisma migrate deploy

      # Deploy to Vercel (only on push to main)
      # Vercel CLI version is pinned in .github/tools/package.json (kept out of the app's deps)
      # and updated by Dependabot. Its bin dir is added to PATH so later steps can call `vercel`.
      - name: Install deploy tools (Vercel CLI)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pnpm install --frozen-lockfile --dir .github/tools
          echo "$GITHUB_WORKSPACE/.github/tools/node_modules/.bin" >> "$GITHUB_PATH"
          .github/tools/node_modules/.bin/vercel --version

      - name: Pull and refresh Vercel Environment Information
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

          # Remove existing environment variables first
          vercel env rm GOOGLE_CLIENT_ID --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel env rm GOOGLE_CLIENT_SECRET --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel env rm NEXTAUTH_URL --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel env rm NEXTAUTH_SECRET --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel env rm ADMIN_EMAILS --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel env rm MEMBER_EMAILS --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel env rm DATABASE_URL --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel env rm URJ_FSFY_API --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel env rm URJ_FSFY_API_USER --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel env rm URJ_FSFY_API_PWD --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel env rm SPECIAL_DEVICE_IPS --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel env rm SHOULD_CALL_REAL_API --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel env rm NEXT_PUBLIC_BILLING_START_DATE --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }} || true

          # Add environment variables using Vercel CLI without newlines
          printf "%s" "${{ secrets.GOOGLE_CLIENT_ID }}" > google_client_id.txt
          vercel env add GOOGLE_CLIENT_ID --environment=preview < google_client_id.txt --token=${{ secrets.VERCEL_TOKEN }}
          rm google_client_id.txt

          printf "%s" "${{ secrets.GOOGLE_CLIENT_SECRET }}" > google_client_secret.txt
          vercel env add GOOGLE_CLIENT_SECRET --environment=preview < google_client_secret.txt --token=${{ secrets.VERCEL_TOKEN }}
          rm google_client_secret.txt

          printf "%s" "https://preview-subhash-malireddy-urjaamaapakaha.vercel.app" > nextauth_url.txt
          vercel env add NEXTAUTH_URL --environment=preview < nextauth_url.txt --token=${{ secrets.VERCEL_TOKEN }}
          rm nextauth_url.txt

          printf "%s" "${{ secrets.NEXTAUTH_SECRET }}" > nextauth_secret.txt
          vercel env add NEXTAUTH_SECRET --environment=preview < nextauth_secret.txt --token=${{ secrets.VERCEL_TOKEN }}
          rm nextauth_secret.txt

          printf "%s" "${{ secrets.ADMIN_EMAILS }}" > admin_emails.txt
          vercel env add ADMIN_EMAILS --environment=preview < admin_emails.txt --token=${{ secrets.VERCEL_TOKEN }}
          rm admin_emails.txt

          printf "%s" "${{ secrets.MEMBER_EMAILS }}" > member_emails.txt
          vercel env add MEMBER_EMAILS --environment=preview < member_emails.txt --token=${{ secrets.VERCEL_TOKEN }}
          rm member_emails.txt

          printf "%s" "${{ secrets.DATABASE_URL }}" > database_url.txt
          vercel env add DATABASE_URL --environment=preview < database_url.txt --token=${{ secrets.VERCEL_TOKEN }}
          rm database_url.txt

          printf "%s" "${{ secrets.URJ_FSFY_API }}" > urj_fsfy_api.txt
          vercel env add URJ_FSFY_API --environment=preview < urj_fsfy_api.txt --token=${{ secrets.VERCEL_TOKEN }}
          rm urj_fsfy_api.txt

          printf "%s" "${{ secrets.URJ_FSFY_API_USER }}" > urj_fsfy_api_user.txt
          vercel env add URJ_FSFY_API_USER --environment=preview < urj_fsfy_api_user.txt --token=${{ secrets.VERCEL_TOKEN }}
          rm urj_fsfy_api_user.txt

          printf "%s" "${{ secrets.URJ_FSFY_API_PWD }}" > urj_fsfy_api_pwd.txt
          vercel env add URJ_FSFY_API_PWD --environment=preview < urj_fsfy_api_pwd.txt --token=${{ secrets.VERCEL_TOKEN }}
          rm urj_fsfy_api_pwd.txt

          printf "%s" "${{ secrets.SPECIAL_DEVICE_IPS }}" > special_device_ips.txt
          vercel env add SPECIAL_DEVICE_IPS --environment=preview < special_device_ips.txt --token=${{ secrets.VERCEL_TOKEN }}
          rm special_device_ips.txt

          printf "%s" "false" > should_call_real_api.txt
          vercel env add SHOULD_CALL_REAL_API --environment=preview < should_call_real_api.txt --token=${{ secrets.VERCEL_TOKEN }}
          rm should_call_real_api.txt

          printf "%s" "${{ vars.NEXT_PUBLIC_BILLING_START_DATE }}" > next_public_billing_start_date.txt
          vercel env add NEXT_PUBLIC_BILLING_START_DATE --environment=preview < next_public_billing_start_date.txt --token=${{ secrets.VERCEL_TOKEN }}
          rm next_public_billing_start_date.txt

      - name: Pull Latest Vercel Environment Information
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # `vercel deploy` waits until the deployment is ready and never exits if Vercel blocks
        # or stalls it, so cap it instead of hanging until the 6-hour job limit.
        timeout-minutes: 10
        run: |
          # The deployment URL goes to stdout; progress and errors go to stderr, which stays in
          # the job log. The shell runs with -e, so a failed deploy fails the step right here.
          deploymentUrl=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to $deploymentUrl"

          # Set a consistent alias for the deployment
          vercel alias "$deploymentUrl" preview-${{ github.repository_owner }}-${{ github.event.repository.name }}.vercel.app --token=${{ secrets.VERCEL_TOKEN }} --scope=${{secrets.VERCEL_TEAM_ID}}
